apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app-deployment
  labels: 
    app: my-app

spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
        - name: my-app
          image: nanajanashia/k8s-demo-app:v1.2
          ports:
          - containerPort: 3000